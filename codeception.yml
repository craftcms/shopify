actor: Tester
paths:
  tests: tests
  log: tests/_output
  output: tests/_output
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
bootstrap: _bootstrap.php
coverage:
  enabled: true
  include:
    - src/*
  exclude:
    - src/migrations/*
    - src/templates/*
    - src/translations/*
    - src/web/assets/*
    - tests/*
    - vendor/*
params:
  - env
  - tests/.env
modules:
  config:
    \craft\test\Craft:
      configFile: 'tests/_craft/config/test.php'
      entryUrl: 'http://test.craftcms.test/index.php'
      projectConfig: {}
      migrations: []
      plugins:
        shopify:
          class: '\craft\shopify\Plugin'
          handle: shopify
      cleanup: true
      transaction: true
      dbSetup: {clean: true, setupCraft: true}
      fullMock: false
groups:
  services: [tests/unit/services]
  jobs: [tests/unit/jobs]
